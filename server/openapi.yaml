openapi: 3.0.3
info: { title: ChoiceProof Gateway API, version: 1.0.0, description: Verify the choice. Bind the payment. }
servers: [{ url: http://localhost:3000/api/v1 }]
paths:
  /auth/demo-login: { post: { summary: Demo login, responses: { '200': { description: JWT issued } } } }
  /sessions: { post: { summary: Create shopping session, security: [{ bearerAuth: [] }], responses: { '201': { description: Session created } } } }
  /sessions/{sessionId}/intent/parse: { post: { summary: Parse intent, security: [{ bearerAuth: [] }], responses: { '200': { description: Parsed intent } } } }
  /sessions/{sessionId}/evaluate: { post: { summary: Run deterministic ChoiceProof, security: [{ bearerAuth: [] }], responses: { '200': { description: Evaluation } } } }
  /evaluations/{evaluationId}/permit: { post: { summary: Issue exact-cart payment permit, security: [{ bearerAuth: [] }], responses: { '201': { description: Permit issued } } } }
  /permits/{permitId}/create-order: { post: { summary: Validate cart and create payment order, security: [{ bearerAuth: [] }], responses: { '200': { description: Order created }, '409': { description: Cart blocked } } } }
components: { securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } } }
